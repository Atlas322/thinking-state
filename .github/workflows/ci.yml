name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:copy
      - run: npm run build
      - name: Layout checks (overflow, typography)
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npm run check:overflow -- --url http://127.0.0.1:4173
          npm run check:typography -- --url http://127.0.0.1:4173
